<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Phoenix — Plataforma de gestión de negocios moderna y segura."
    />
    <title>Phoenix - Acceder</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./Assets/Css/styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer type="module" src="./Assets/Js/main.js"></script>
    <script defer type="module" src="./Assets/Js/firebase.js"></script>
  </head>
  <body>
    <div class="auth-wrapper">
      <!-- ═══ Panel Izquierdo — Branding ═══ -->
      <aside class="auth-panel-left">
        <div class="brand">
          <div class="brand-icon">
            <i class="bi bi-fire"></i>
          </div>
          <h1 class="brand-name">Phoenix</h1>
          <p class="brand-tagline">
            Gestiona tu negocio con claridad, velocidad y estilo desde un solo
            lugar.
          </p>
        </div>

        <div class="bento-deco" aria-hidden="true">
          <div class="bento-deco-item"><i class="bi bi-shop"></i></div>
          <div class="bento-deco-item">
            <i class="bi bi-bar-chart-line"></i>
          </div>
          <div class="bento-deco-item"><i class="bi bi-fire"></i></div>
          <div class="bento-deco-item"><i class="bi bi-credit-card"></i></div>
          <div class="bento-deco-item">
            <i class="bi bi-lightning-charge"></i>
          </div>
        </div>
      </aside>

      <!-- ═══ Panel Derecho — Auth ═══ -->
      <main class="auth-panel-right">
        <div class="auth-card">
          <div class="auth-card-header">
            <h1 id="auth-title">Iniciar sesión</h1>
            <p id="auth-subtitle">
              Ingresa tus credenciales para acceder al panel.
            </p>
          </div>

          <!-- Tabs -->
          <div class="auth-tabs" role="tablist">
            <button
              id="tab-login"
              class="auth-tab active"
              role="tab"
              aria-selected="true"
              aria-controls="section-login"
            >
              Iniciar sesión
            </button>
            <button
              id="tab-register"
              class="auth-tab"
              role="tab"
              aria-selected="false"
              aria-controls="section-register"
            >
              Registrarse
            </button>
          </div>

          <!-- ── LOGIN ── -->
          <section
            id="section-login"
            class="form-section active"
            role="tabpanel"
            aria-labelledby="tab-login"
          >
            <div class="auth-form">
              <div class="form-group">
                <label for="login-email">Correo electrónico</label>
                <div class="input-icon-wrap">
                  <input
                    type="email"
                    id="login-email"
                    placeholder="tu@correo.com"
                    autocomplete="email"
                    required
                  />
                  <i class="bi bi-envelope input-icon" aria-hidden="true"></i>
                </div>
              </div>

              <div class="form-group">
                <label for="login-password">Contraseña</label>
                <div class="input-icon-wrap">
                  <input
                    type="password"
                    id="login-password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  />
                  <i class="bi bi-lock input-icon" aria-hidden="true"></i>
                  <button
                    type="button"
                    class="toggle-password"
                    id="toggle-login-pass"
                    aria-label="Mostrar contraseña"
                    tabindex="-1"
                  >
                    <i class="bi bi-eye" id="icon-login-pass"></i>
                  </button>
                </div>
              </div>

              <button
                type="button"
                id="btn-login"
                class="btn-primary btn-green"
              >
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
              </button>
            </div>
          </section>

          <!-- ── REGISTRO ADMINISTRADOR ── -->
          <section
            id="section-register"
            class="form-section"
            role="tabpanel"
            aria-labelledby="tab-register"
          >
            <div class="auth-form">
              <div class="form-group">
                <label for="reg-email">Correo electrónico</label>
                <div class="input-icon-wrap">
                  <input
                    type="email"
                    id="reg-email"
                    placeholder="tu@correo.com"
                    autocomplete="email"
                    required
                  />
                  <i class="bi bi-envelope input-icon" aria-hidden="true"></i>
                </div>
              </div>

              <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <div class="input-icon-wrap">
                  <input
                    type="password"
                    id="reg-password"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                  <i class="bi bi-lock input-icon" aria-hidden="true"></i>
                  <button
                    type="button"
                    class="toggle-password"
                    id="toggle-reg-pass"
                    aria-label="Mostrar contraseña"
                    tabindex="-1"
                  >
                    <i class="bi bi-eye" id="icon-reg-pass"></i>
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label for="reg-password-confirm">Confirmar contraseña</label>
                <div class="input-icon-wrap">
                  <input
                    type="password"
                    id="reg-password-confirm"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                  <i class="bi bi-lock-fill input-icon" aria-hidden="true"></i>
                  <button
                    type="button"
                    class="toggle-password"
                    id="toggle-reg-confirm"
                    aria-label="Mostrar contraseña"
                    tabindex="-1"
                  >
                    <i class="bi bi-eye" id="icon-reg-confirm"></i>
                  </button>
                </div>
              </div>

              <button
                type="button"
                id="btn-register"
                class="btn-primary btn-green"
              >
                <i class="bi bi-person-check"></i>
                Crear cuenta de administrador
              </button>
            </div>
          </section>
        </div>
        <!-- /auth-card -->
      </main>
    </div>
    <!-- /auth-wrapper -->

    <script>
      /* ── Switch tabs ── */
      const tabHeaders = {
        login: {
          title: "Iniciar sesión",
          subtitle: "Ingresa tus credenciales para acceder al panel.",
        },
        register: {
          title: "Crear cuenta",
          subtitle: "Regístrate como administrador de Phoenix.",
        },
      };

      ["login", "register"].forEach((tab) => {
        document.getElementById("tab-" + tab).addEventListener("click", () => {
          ["login", "register"].forEach((t) => {
            const isActive = t === tab;
            document
              .getElementById("tab-" + t)
              .classList.toggle("active", isActive);
            document
              .getElementById("tab-" + t)
              .setAttribute("aria-selected", String(isActive));
            document
              .getElementById("section-" + t)
              .classList.toggle("active", isActive);
          });
          document.getElementById("auth-title").textContent =
            tabHeaders[tab].title;
          document.getElementById("auth-subtitle").textContent =
            tabHeaders[tab].subtitle;
        });
      });

      /* ── Toggle mostrar/ocultar contraseña ── */
      function setupToggle(btnId, inputId, iconId) {
        document.getElementById(btnId).addEventListener("click", () => {
          const input = document.getElementById(inputId);
          const icon = document.getElementById(iconId);
          const isPass = input.type === "password";
          input.type = isPass ? "text" : "password";
          icon.className = isPass ? "bi bi-eye-slash" : "bi bi-eye";
        });
      }

      setupToggle("toggle-login-pass", "login-password", "icon-login-pass");
      setupToggle("toggle-reg-pass", "reg-password", "icon-reg-pass");
      setupToggle(
        "toggle-reg-confirm",
        "reg-password-confirm",
        "icon-reg-confirm",
      );
    </script>
  </body>
</html>
