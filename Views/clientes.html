<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phoenix — Registro de Clientes">
  <title>Phoenix — Nuevo Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../Assets/Css/clientes.css">
  
  <!-- Lógica e integración -->
  <script defer type="module" src="../Assets/Js/firebase.js"></script>
  <script defer type="module" src="../Assets/Js/clientes.js"></script>
</head>
<body>

  <div class="clientes-wrapper">
    
    <!-- Header -->
    <div class="clientes-header">
      <div class="clientes-header-left">
        <div class="view-icon green">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <div>
          <h1 class="clientes-title">Registrar Cliente</h1>
          <p class="clientes-subtitle">Ingresa los datos para dar de alta un nuevo perfil de cliente.</p>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="form-container">
      <form id="form-registro-cliente" class="neo-form">
        
        <!-- Sección 1: Datos Personales -->
        <div class="form-section-title">
          <i class="bi bi-person"></i> Datos Personales
        </div>
        
        <div class="form-grid">
          <div class="form-group">
            <label for="cliente-nombre">Nombre del cliente</label>
            <div class="input-wrap">
              <i class="bi bi-person input-icon"></i>
              <input type="text" id="cliente-nombre" placeholder="Ej. Juan Pérez" required>
            </div>
          </div>
          
          <div class="form-group">
            <label for="cliente-numero">Número de teléfono</label>
            <div class="input-wrap">
              <i class="bi bi-telephone input-icon"></i>
              <input type="tel" id="cliente-numero" placeholder="Ej. +505 8888 8888" required>
            </div>
          </div>
        </div>

        <!-- Sección 2: Datos del Negocio -->
        <div class="form-section-title mt-4">
          <i class="bi bi-shop"></i> Datos del Negocio
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="negocio-nombre">Nombre del negocio</label>
            <div class="input-wrap">
              <i class="bi bi-building input-icon"></i>
              <input type="text" id="negocio-nombre" placeholder="Ej. Tienda El Sol" required>
            </div>
          </div>
          
          <div class="form-group">
            <label for="negocio-direccion">Dirección del negocio</label>
            <div class="input-wrap">
              <i class="bi bi-geo-alt input-icon"></i>
              <input type="text" id="negocio-direccion" placeholder="Ej. Del parque central 2C al norte" required>
            </div>
          </div>
        </div>

        <!-- Sección 3: Autenticación / Token -->
        <div class="form-section-title mt-4">
          <i class="bi bi-key"></i> Autenticación de Servicio
        </div>

        <div class="form-group">
          <label for="servicio-token">Token de servicio</label>
          <div class="token-wrap">
            <div class="input-wrap flex-1">
              <i class="bi bi-shield-lock input-icon"></i>
              <input type="text" id="servicio-token" placeholder="Presiona generar para crear un token" readonly required>
            </div>
            <button type="button" id="btn-generar-token" class="btn-secondary">
              <i class="bi bi-arrow-clockwise"></i> Generar
            </button>
          </div>
          <small class="form-hint">Este token único vinculará los servicios exclusivos del cliente.</small>
        </div>

        <!-- Acciones -->
        <div class="form-actions">
          <button type="button" id="btn-cancelar" class="btn-ghost">Cancelar</button>
          <button type="submit" id="btn-guardar" class="btn-primary">
            <i class="bi bi-floppy"></i> Guardar Cliente
          </button>
        </div>

      </form>
    </div>

  </div>

</body>
</html>
